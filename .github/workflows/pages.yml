name: Deploy static guide explorer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/idsignpost/web/**"
      - "idsignpost.json"
      - "idsignpost.csv"
      - "idsignpost.parquet"
      - "idsignpost.db"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble Pages bundle
        run: |
          mkdir -p _site
          cp src/idsignpost/web/index.html src/idsignpost/web/styles.css src/idsignpost/web/app.js _site/
          cp idsignpost.json idsignpost.csv idsignpost.parquet idsignpost.db _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
