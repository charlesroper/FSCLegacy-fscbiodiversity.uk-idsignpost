[project]
name = "idsignpost-extractor"
version = "0.1.0"
description = "Extract idsignpost HTML entries into markdown."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ddgs>=9.16.0",
    "httpx>=0.28.0",
    "markdownify>=0.12.1",
    "pyarrow>=14.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

